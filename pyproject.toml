[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-vision-enhancement"
version = "0.1.0"
description = "Reproducible classical image-enhancement experiments and metrics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3.0",
    "opencv-python-headless>=4.8,<5.0",
    "scikit-image>=0.22,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
vision-enhance = "vision_enhance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
